<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommendation System</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }
        .results {
            margin-top: 20px;
        }
        li {
            font-size: 18px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Movie Recommendation System</h2>

    <form method="POST">
        <label>Enter a movie name:</label>
        <input type="text" name="movie" placeholder="Example: Inception" required>
        <button type="submit">Get Recommendations</button>
    </form>

    {% if recommendations %}
    <div class="results">
        <h3>Recommended Movies:</h3>
        <ul>
            {% for movie in recommendations %}
            <li>{{ movie }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>

</body>
</html>
